<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ---------- ตัวแปรสี (เปลี่ยนสีทั้งเว็บได้ที่นี่) ---------- */
  :root {
    --bg-1: #1a1660;
    --bg-2: #0b0a2e;
    --card: #1d1b52;
    --card-line: #3b3883;
    --chip: #2b2972;
    --purple: #8b6cff;
    --purple-soft: #a99dff;
    --pink: #e0a6ff;
    --text: #eef0ff;
    --muted: #cfd0ee;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: "Prompt", sans-serif;
    color: var(--text);
    background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 60%);
    min-height: 100vh;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

  /* ---------- Hero ---------- */
  .hero { text-align: center; padding: 70px 0 110px; }
  .avatar {
    width: 130px; height: 130px; margin: 0 auto 28px;
    border-radius: 50%;
    background: var(--purple);
    display: grid; place-items: center;
    font-size: 64px;
  }
  .info { color: var(--purple-soft); font-weight: 700; letter-spacing: .5px; margin: 0 0 14px; }
  .hero h1 { font-size: clamp(48px, 9vw, 88px); margin: 0; font-weight: 800; line-height: 1.1; }
  .hero h1 span {
    background: linear-gradient(90deg, var(--purple), var(--pink));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { color: var(--muted); font-size: 18px; margin: 26px 0 34px; }
  .buttons { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .btn-main, .btn-line {
    padding: 16px 26px; border-radius: 14px; text-decoration: none;
    font-weight: 700; font-size: 18px; color: #fff;
  }
  .btn-main { background: linear-gradient(90deg, #7b5cf5, #a07bff); }
  .btn-line { border: 1px solid #5a56a8; }
  .btn-main:hover, .btn-line:hover { filter: brightness(1.15); }
  a:focus-visible { outline: 2px solid var(--pink); outline-offset: 3px; }

  /* ---------- ส่วนผลงาน ---------- */
  .eyebrow { color: var(--purple-soft); font-weight: 700; }
  .head { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 10px; margin-bottom: 36px; }
  .head h2 { font-size: 44px; margin: 8px 0 0; }
  .count { color: #8f86ff; font-weight: 700; letter-spacing: 1px; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; padding-bottom: 80px; }
  .card {
    background: var(--card); border: 1px solid var(--card-line);
    border-radius: 28px; padding: 30px;
    display: flex; flex-direction: column;
  }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .icon { width: 64px; height: 64px; border-radius: 18px; background: #34318a; display: grid; place-items: center; font-size: 32px; }
  .badge { background: #2d2b7a; color: #cfc9ff; font-size: 13px; font-weight: 700; padding: 8px 16px; border-radius: 999px; border: 1px solid #4a47a8; }
  .card h3 { font-size: 24px; margin: 22px 0 10px; }
  .card p { color: var(--muted); line-height: 1.7; margin: 0 0 18px; flex: 1; }
  .tags { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }
  .tags span { background: var(--chip); padding: 8px 14px; border-radius: 10px; font-size: 14px; }
  .btn { display: block; padding: 15px 18px; border: 1px solid #4a47a8; border-radius: 12px; background: #211f5e; color: #fff; text-decoration: none; font-weight: 500; }
  .btn:hover { background: #2f2c80; }

  footer { text-align: center; color: #8e8cc0; padding: 30px 0 50px; font-size: 14px; }

  @media (max-width: 760px) {
    .grid { grid-template-columns: 1fr; }
    .head h2 { font-size: 34px; }
    .info { font-size: 14px; }
  }
</style>
</head>
<body>

<!-- ================= Hero ================= -->
<header class="hero">
  <div class="wrap">
    <div class="avatar" aria-hidden="true">🧑‍💻</div>
    <p class="info" id="info"></p>
    <h1>My <span>Portfolio</span></h1>
    <p class="sub">เว็บไซต์รวบรวมผลงานและแบบฝึกหัดการพัฒนาระบบสารสนเทศ</p>
    <div class="buttons">
      <a class="btn-main" href="#works">ดูผลงานของฉัน</a>
      <a class="btn-line" id="github" href="#" target="_blank" rel="noopener">GitHub ↗</a>
    </div>
  </div>
</header>

<!-- ================= ผลงาน ================= -->
<main class="wrap" id="works">
  <div class="eyebrow">My works</div>
  <div class="head">
    <h2>ผลงานของฉัน</h2>
    <div class="count" id="count"></div>
  </div>
  <section class="grid" id="grid"></section>
</main>

<footer id="footer"></footer>

<script>
  /* ==========================================================
     1) ข้อมูลส่วนตัว: แก้ตรงนี้
     ========================================================== */
  const profile = {
    name: "นายชิสณุพงศ์ มิตรเจริญ",
    studentId: "664245005",
    room: "66/43",
    major: "สาขาวิทยาการคอมพิวเตอร์",
    github: "https://weonbank12.github.io/"
  };

  /* ==========================================================
     2) ผลงาน: แก้ตรงนี้ (เพิ่มได้ไม่จำกัด คัดลอกก้อน { ... }, ไปวางต่อท้าย)
        icon  = emoji      badge = ป้ายมุมขวาบน
        tags  = แท็กเทคโนโลยี   link  = ลิงก์ Colab หรือไฟล์ PDF
     ========================================================== */
  const works = [
    { icon: "⚽", badge: "PROJECT 01", title: "Sports Recommender System",
  desc: "ระบบแนะนำกีฬาโดยใช้แนวคิดกราฟ เพื่อแสดงความสัมพันธ์ระหว่างข้อมูลและการแนะนำกีฬาที่เหมาะกับผู้ใช้",
  tags: ["Python", "Graph", "Google Colab"],
  link: "https://colab.research.google.com/github/weonbank12/weonbank12.github.io/blob/main/664245005_Sport_System.ipynb", btn: "💻 เปิด Google Colab ↗" },
    
    { icon: "🧠", badge: "ASSIGNMENT 1", title: "Pet Recommender System Neo4j",
      desc: "ระบบแนะนำสัตว์เลี้ยงโดยใช้ฐานข้อมูลกราฟ Neo4j เพื่อจัดเก็บข้อมูลและแสดงความสัมพันธ์ของข้อมูล",
      tags: ["Python", "Neo4j", "Google Colab"],
      link: "https://colab.research.google.com/", btn: "💻 เปิด Google Colab ↗" },

    { icon: "📚", badge: "ASSIGNMENT 02", title: "Assignment School Book",
      desc: "งานมอบหมายเกี่ยวกับ School Book รวบรวมรายละเอียดและผลการทำงานไว้ในเอกสาร PDF",
      tags: ["Assignment", "PDF"],
      link: "files/school-book.pdf", btn: "📄 เปิดไฟล์ PDF ↗" },

    { icon: "🏫", badge: "ASSIGNMENT 03", title: "Assignment Club",
      desc: "งานมอบหมายเกี่ยวกับ Club พร้อมเอกสารประกอบการทำงานในรูปแบบ PDF",
      tags: ["Assignment", "PDF"],
      link: "files/club.pdf", btn: "📄 เปิดไฟล์ PDF ↗" }
  ];

  /* ---------- โค้ดด้านล่างไม่ต้องแก้ ---------- */
  document.getElementById("info").textContent =
    `${profile.name} || เลขประจำตัว ${profile.studentId} || ห้อง ${profile.room} || ${profile.major}`;
  document.getElementById("github").href = profile.github;
  document.getElementById("footer").textContent = `© ${new Date().getFullYear()} ${profile.name}`;

  const grid = document.getElementById("grid");
  works.forEach(w => {
    const card = document.createElement("article");
    card.className = "card";
    card.innerHTML = `
      <div class="top">
        <div class="icon">${w.icon}</div>
        <span class="badge">${w.badge}</span>
      </div>
      <h3>${w.title}</h3>
      <p>${w.desc}</p>
      <div class="tags">${w.tags.map(t => `<span>${t}</span>`).join("")}</div>
      <a class="btn" href="${w.link}" target="_blank" rel="noopener">${w.btn}</a>`;
    grid.appendChild(card);
  });
  document.getElementById("count").textContent =
    "SELECTED WORKS · " + String(works.length).padStart(2, "0");
</script>
</body>
</html>
